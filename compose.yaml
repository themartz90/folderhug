# Preserve existing named volumes when updating installations.
name: http-wrapper

services:
  media-setup:
    profiles: [tools]
    image: ${FOLDERHUG_IMAGE:-ghcr.io/themartz90/folderhug:latest}
    command: [setup-media]
    environment:
      FOLDERHUG_WORKER_KEY: /worker-key/worker.key
    volumes:
      - worker-key:/worker-key
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
  setup:
    profiles: [tools]
    image: ${FOLDERHUG_IMAGE:-ghcr.io/themartz90/folderhug:latest}
    command: [setup]
    environment:
      FOLDERHUG_DATA_DIR: /data
      FOLDERHUG_KEYS_DIR: /keys
    volumes:
      - data:/data
      - keys:/keys
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    stdin_open: true
    tty: true
  app:
    image: ${FOLDERHUG_IMAGE:-ghcr.io/themartz90/folderhug:latest}
    ports:
      - "127.0.0.1:${FOLDERHUG_PORT-${HTTPWRAPPER_PORT:-8080}}:8080"
    environment:
      GOMEMLIMIT: 384MiB
      FOLDERHUG_ADDR: "0.0.0.0:8080"
      FOLDERHUG_PUBLIC_URL: "${FOLDERHUG_PUBLIC_URL-${HTTPWRAPPER_PUBLIC_URL:-http://localhost:8080}}"
      FOLDERHUG_DATA_DIR: /data
      FOLDERHUG_KEYS_DIR: /keys
      FOLDERHUG_DOWNLOADS_DIR: /downloads
      FOLDERHUG_MOUNTED_ROOTS: '${FOLDERHUG_MOUNTED_ROOTS-${HTTPWRAPPER_MOUNTED_ROOTS:-[]}}'
      FOLDERHUG_CACHE_DIR: /cache
    volumes:
      - data:/data
      - keys:/keys
      - downloads:/downloads
      # Add an existing host folder and set FOLDERHUG_MOUNTED_ROOTS above, as shown in README.md.
      # - /mnt/Plex:/mnt/Plex:rw
      - cache:/cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test: [CMD, folderhug, healthcheck]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  data:
  keys:
  downloads:
  cache:
  worker-key:
