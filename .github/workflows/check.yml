name: Checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/check-public.mjs
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: npm audit
        working-directory: web
      - run: go test -race ./...
        if: runner.os == 'Linux'
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
        if: runner.os == 'Linux'
      - run: npm run test:e2e
        working-directory: web
        if: runner.os == 'Linux'
      - run: docker compose config --quiet
        if: runner.os == 'Linux'
      - run: docker compose build
        if: runner.os == 'Linux'
      - run: docker compose --profile media -f compose.yaml -f compose.media.yaml config --quiet
        if: runner.os == 'Linux'
      - run: docker build --target app -t folderhug:ci .
        if: runner.os == 'Linux'
      - run: bash scripts/ci-container-smoke.sh folderhug:ci
        if: runner.os == 'Linux'
      - run: docker build --target media -t folderhug:media-ci .
        if: runner.os == 'Linux'
      - run: docker build --target media-test -t folderhug:media-test-ci .
        if: runner.os == 'Linux'
      - run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=256m,mode=1777
          -e MEDIAWORKER_FFMPEG_INTEGRATION=1 -e MEDIAWORKER_FIXTURE_DIR=/tmp/fixtures
          --entrypoint sh folderhug:media-test-ci -c
          'sh /usr/local/bin/generate-media-fixtures /tmp/fixtures &&
          /usr/local/bin/mediaworker.test -test.v && /usr/local/bin/mediabroker.test && /usr/local/bin/thumbnails.test'
        if: runner.os == 'Linux'
