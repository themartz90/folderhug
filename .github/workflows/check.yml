name: Checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/check-public.mjs
      - name: Check exact Debian source snapshot fallback
        if: runner.os == 'Linux'
        run: |
          python3 -B -m unittest discover -s tests/scripts -p 'test_debian_snapshot_sources.py' -v
          bash tests/scripts/test_collect_debian_sources.sh
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
        if: runner.os == 'Linux'
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit
        working-directory: web
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race ./...
        if: runner.os == 'Linux'

  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: web
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-failure-${{ matrix.browser }}
          path: web/test-results/
          retention-days: 5
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Check Compose setting compatibility
        shell: bash
        run: |
          HTTPWRAPPER_PORT=18080 HTTPWRAPPER_PUBLIC_URL=http://localhost:18080 HTTPWRAPPER_MOUNTED_ROOTS='[{"id":"old"}]' \
            docker compose --env-file /dev/null config --format json | jq -e '
              .name == "http-wrapper" and
              .services.app.ports[0].published == "18080" and
              .services.app.environment.FOLDERHUG_PUBLIC_URL == "http://localhost:18080" and
              (.services.app.environment.FOLDERHUG_MOUNTED_ROOTS | fromjson | .[0].id == "old")'
          FOLDERHUG_PORT=18081 FOLDERHUG_PUBLIC_URL=http://localhost:18081 FOLDERHUG_MOUNTED_ROOTS='[]' \
            HTTPWRAPPER_PORT=18080 HTTPWRAPPER_PUBLIC_URL=http://localhost:18080 HTTPWRAPPER_MOUNTED_ROOTS='[{"id":"old"}]' \
            docker compose --env-file /dev/null config --format json | jq -e '
              .services.app.ports[0].published == "18081" and
              .services.app.environment.FOLDERHUG_PUBLIC_URL == "http://localhost:18081" and
              .services.app.environment.FOLDERHUG_MOUNTED_ROOTS == "[]"'
      - run: docker compose -f compose.yaml -f compose.build.yaml build app
      - run: docker build --platform linux/amd64 --target app -t folderhug:ci .
      - run: bash scripts/ci-container-smoke.sh folderhug:ci
