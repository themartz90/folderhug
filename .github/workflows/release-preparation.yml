name: Prepare draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing version tag, for example v1.2.3 or v1.2.3-rc.1
        type: string
        required: true

concurrency:
  group: release-preparation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.tag.outputs.source_sha }}
      version_tag: ${{ steps.tag.outputs.version_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check the explicit tag and tested revision
        id: tag
        env:
          TAG_INPUT: ${{ inputs.version_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
            tag=$TAG_INPUT
          else
            tag=$GITHUB_REF_NAME
            test "$GITHUB_REF" = "refs/tags/$tag"
          fi
          if [[ ! $tag =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N.' >&2
            exit 1
          fi
          git show-ref --tags --verify --quiet "refs/tags/$tag"
          sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            test "$sha" = "$GITHUB_SHA"
          fi
          gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml --commit "$sha" --event push --limit 100 \
            --json status,conclusion,headSha | jq -e --arg sha "$sha" \
            'any(.[]; .status == "completed" and .conclusion == "success" and .headSha == $sha)'
          if ! gh run list --repo "$GITHUB_REPOSITORY" --workflow image-build.yml --commit "$sha" --event workflow_dispatch --limit 100 \
            --json status,conclusion,headSha | jq -e --arg sha "$sha" \
            'any(.[]; .status == "completed" and .conclusion == "success" and .headSha == $sha)'; then
            echo 'Run Build images with publish_images=true for this commit, then retry draft preparation.' >&2
            exit 1
          fi
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version_tag=$tag" >> "$GITHUB_OUTPUT"

  verify-and-package:
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
          persist-credentials: false
      - run: node scripts/check-public.mjs
      - name: Pull the tested image and verify source labels
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
        run: |
          set -euo pipefail
          app="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          for image in "$app"; do
            docker pull --platform linux/amd64 "$image:sha-$SOURCE_SHA"
            test "$(docker image inspect "$image:sha-$SOURCE_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
            test "$(docker image inspect "$image:sha-$SOURCE_SHA" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          done
      - name: Package Compose, checksums, notices, and exact Debian sources
        env:
          TAG: ${{ needs.validate-tag.outputs.version_tag }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
        run: |
          app="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$SOURCE_SHA"
          bash scripts/package-release.sh "$TAG" "$SOURCE_SHA" "$app" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  create-draft:
    needs: [validate-tag, verify-and-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: draft-assets
          path: dist
      - name: Recheck the tag and create a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-tag.outputs.version_tag }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to replace it.' >&2
            exit 1
          fi
          (
            cd dist
            sha256sum -c "folderhug-checksums-$TAG.txt"
          )
          printf 'Source commit: %s\nSource archive: https://github.com/%s/archive/%s.tar.gz\n\nThe image manifest records the exact app digest used for these assets. Check the attached package source and copyright materials against the built image before publishing this draft.\n' \
            "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$SOURCE_SHA" > "$RUNNER_TEMP/release-notes.md"
          release_args=(--draft --verify-tag --title "Folderhug $TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ $TAG == *-rc.* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${release_args[@]}"
