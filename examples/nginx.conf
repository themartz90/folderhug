# Example for a host-level nginx proxy. Replace the hostname and certificate paths.
# Keep the app's Compose port on loopback and set its public URL to https://files.example.test.
events {}

http {
    server {
        listen 443 ssl;
        server_name files.example.test;

        ssl_certificate /etc/nginx/tls/files.example.test.crt;
        ssl_certificate_key /etc/nginx/tls/files.example.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://127.0.0.1:48321;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 60s;
        }
    }
}
