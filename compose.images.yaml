name: folderhug

services:
  setup:
    profiles: [tools]
    image: ${FOLDERHUG_IMAGE:?Set FOLDERHUG_IMAGE to the exact Folderhug image tag or digest}
    command: [setup]
    environment:
      HTTPWRAPPER_DATA_DIR: /data
      HTTPWRAPPER_KEYS_DIR: /keys
    volumes:
      - data:/data
      - keys:/keys
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    stdin_open: true
    tty: true
  app:
    image: ${FOLDERHUG_IMAGE:?Set FOLDERHUG_IMAGE to the exact Folderhug image tag or digest}
    ports:
      - "127.0.0.1:${HTTPWRAPPER_PORT:-8080}:8080"
    environment:
      GOMEMLIMIT: 384MiB
      HTTPWRAPPER_ADDR: "0.0.0.0:8080"
      HTTPWRAPPER_PUBLIC_URL: "${HTTPWRAPPER_PUBLIC_URL:-http://localhost:8080}"
      HTTPWRAPPER_DATA_DIR: /data
      HTTPWRAPPER_KEYS_DIR: /keys
      HTTPWRAPPER_DOWNLOADS_DIR: /downloads
      HTTPWRAPPER_MOUNTED_ROOTS: '${HTTPWRAPPER_MOUNTED_ROOTS:-[]}'
      HTTPWRAPPER_CACHE_DIR: /cache
    volumes:
      - data:/data
      - keys:/keys:ro
      - downloads:/downloads
      - cache:/cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test: [CMD, http-wrapper, healthcheck]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  data:
  keys:
  downloads:
  cache:
