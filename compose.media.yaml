services:
  app:
    environment:
      HTTPWRAPPER_MEDIA_SOCKET: /broker/media.sock
      HTTPWRAPPER_WORKER_KEY: /worker-key/worker.key
    volumes:
      - broker:/broker
      - worker-key:/worker-key:ro
  media:
    profiles: [media]
    image: ${FOLDERHUG_MEDIA_IMAGE:-ghcr.io/themartz90/folderhug-media:latest}
    environment:
      HTTPWRAPPER_MEDIA_SOCKET: /broker/media.sock
      HTTPWRAPPER_WORKER_KEY: /worker-key/worker.key
    volumes:
      - broker:/broker:ro
      - worker-key:/worker-key:ro
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 5s
    depends_on:
      app:
        condition: service_healthy
volumes:
  broker:
